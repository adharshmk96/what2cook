name: Deploy

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      app_version:
        description: Release tag or version to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: Optional tag/version (defaults to short SHA)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/what2cook-api
    steps:
      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CALL_VERSION: ${{ inputs.app_version }}
        run: |
          set -Eeuo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG}"
          elif [[ -n "${CALL_VERSION:-}" ]]; then
            version="${CALL_VERSION}"
          else
            version="$(printf '%.7s' "${GITHUB_SHA}")"
          fi
          [[ -n "${version}" ]] || { echo "app version is empty" >&2; exit 1; }

          echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${EVENT_NAME}" == "release" || -n "${CALL_VERSION:-}" ]]; then
            echo "tags=${IMAGE_NAME}:${version},${IMAGE_NAME}:latest" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${IMAGE_NAME}:${version}" >> "${GITHUB_OUTPUT}"
          fi
          echo "checkout_ref=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.app_version }}

      - name: Setup SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]]; then
            echo "DEPLOY_SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          WHAT2COOK_APP_VERSION: ${{ steps.meta.outputs.app_version }}
          IMAGE_API: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          export DEPLOY_SSH_KEY="${HOME}/.ssh/deploy_key"
          # Drop empty overrides so deploy.sh keeps its defaults.
          [[ -n "${DEPLOY_HOST:-}" ]] || unset DEPLOY_HOST
          [[ -n "${DEPLOY_USER:-}" ]] || unset DEPLOY_USER
          [[ -n "${DEPLOY_PATH:-}" ]] || unset DEPLOY_PATH
          [[ -n "${DEPLOY_DOMAIN:-}" ]] || unset DEPLOY_DOMAIN
          ./scripts/deploy.sh

      - name: Verify HTTPS endpoint
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          set -Eeuo pipefail
          domain="${DEPLOY_DOMAIN:-what2cook.${DEPLOY_HOST}.nip.io}"
          url="https://${domain}/healthz"
          echo "Checking ${url}"
          for attempt in $(seq 1 15); do
            if body="$(curl --fail --silent --show-error --max-time 10 "${url}")"; then
              echo "OK (${attempt}/15): ${body:-empty}"
              exit 0
            fi
            echo "attempt ${attempt}/15 failed; retrying in 2s..."
            sleep 2
          done
          echo "HTTPS health check failed for ${url}" >&2
          exit 1
