name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/what2cook-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Resolve image tag
        id: meta
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            echo "app_version=${tag}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "tags=${IMAGE_NAME}:${tag},${IMAGE_NAME}:latest" >> "${GITHUB_OUTPUT}"
          else
            short_sha="$(printf '%.7s' "${GITHUB_SHA}")"
            echo "app_version=${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "tags=${IMAGE_NAME}:${short_sha}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.app_version }}

      - name: Setup SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]]; then
            echo "DEPLOY_SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          WHAT2COOK_APP_VERSION: ${{ steps.meta.outputs.app_version }}
          IMAGE_API: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          export DEPLOY_SSH_KEY="${HOME}/.ssh/deploy_key"
          # Drop empty overrides so deploy.sh keeps its defaults.
          [[ -n "${DEPLOY_HOST:-}" ]] || unset DEPLOY_HOST
          [[ -n "${DEPLOY_USER:-}" ]] || unset DEPLOY_USER
          [[ -n "${DEPLOY_PATH:-}" ]] || unset DEPLOY_PATH
          [[ -n "${DEPLOY_DOMAIN:-}" ]] || unset DEPLOY_DOMAIN
          ./scripts/deploy.sh
