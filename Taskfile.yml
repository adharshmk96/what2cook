version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  init:
    desc: Install dependencies and seed local config
    cmds:
      - ./scripts/init.sh

  build:
    desc: Build UI and API into a single binary
    cmds:
      - ./scripts/build.sh

  run-dev:
    desc: Build and run the server with embedded UI
    cmds:
      - ./scripts/run-dev.sh

  stop-dev:
    desc: Stop the development server
    cmds:
      - ./scripts/stop-dev.sh

  deploy:
    desc: Deploy to VPS (Swarm + Traefik via ../deployer)
    cmds:
      - ./scripts/deploy.sh
