# what2cook app stack for a VPS bootstrapped by ../deployer.
# Prerequisites on the VPS:
#   - Swarm manager ready
#   - Attachable overlay network `proxy`
#   - Shared Traefik stack (entrypoints web/websecure, certresolver le)
#
# Deploy (from deploy.sh, or on the VPS):
#   DOMAIN=what2cook.example.com IMAGE_API=ghcr.io/adharshmk96/what2cook/what2cook-api:tag \
#   WHAT2COOK_AUTH_TOKEN_SECRET=... \
#     docker stack deploy -c stack.yaml what2cook

services:
  api:
    image: ${IMAGE_API}
    environment:
      WHAT2COOK_SERVER_ADDR: ":8080"
      WHAT2COOK_SERVER_PUBLIC_URL: https://${DOMAIN}
      WHAT2COOK_DB_PATH: /data/what2cook.db
      WHAT2COOK_AUTH_TOKEN_SECRET: ${WHAT2COOK_AUTH_TOKEN_SECRET}
    volumes:
      - data:/data
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        # SQLite needs a single writer on one node.
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=proxy
        - traefik.http.routers.what2cook.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.what2cook.entrypoints=websecure
        - traefik.http.routers.what2cook.tls=true
        - traefik.http.routers.what2cook.tls.certresolver=le
        - traefik.http.services.what2cook.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
    name: proxy

volumes:
  data:
